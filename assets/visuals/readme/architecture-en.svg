<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">SMU FNISC RAS platform execution modes</title>
  <desc id="desc">A vertical workflow separating local automation from the public static GitHub Pages build.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M1 1 L12 6.5 L1 12 Z" fill="#182b62"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17233f}
      .title{font-size:32px;font-weight:800}
      .sub{font-size:22px;font-weight:600}
      .box{fill:#fff8ea;stroke:#b8943d;stroke-width:3;rx:18}
      .boxAlt{fill:#f4f7fb;stroke:#296dc1;stroke-width:3;rx:18}
      .num{font-size:24px;font-weight:900;fill:#9e1f2f}
      .label{font-size:25px;font-weight:900}
      .line{font-size:22px;font-weight:600}
      .arrow{stroke:#182b62;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .note{fill:#9e1f2f}
      .noteText{fill:white;font-size:21px;font-weight:700}
    </style>
  </defs>
  <rect width="900" height="900" fill="#ffffff"/>
  <text x="70" y="58" class="title">SMU FNISC RAS execution modes</text>
  <text x="70" y="92" class="sub">The same codebase has local automation and public pages.</text>

  <rect x="90" y="130" width="720" height="112" class="box"/>
  <text x="122" y="172" class="num">1</text>
  <text x="172" y="172" class="label">Public inputs</text>
  <text x="172" y="205" class="line">Member seeds, academic identifiers,</text>
  <text x="172" y="232" class="line">support rules and verified source notes.</text>

  <path class="arrow" d="M450 252 V292"/>

  <rect x="90" y="302" width="720" height="112" class="box"/>
  <text x="122" y="344" class="num">2</text>
  <text x="172" y="344" class="label">Local automation</text>
  <text x="172" y="377" class="line">Prisma, SQLite, harvest scripts, API routes</text>
  <text x="172" y="404" class="line">and LLM drafts run outside static Pages.</text>

  <path class="arrow" d="M450 424 V464"/>

  <rect x="90" y="474" width="720" height="112" class="boxAlt"/>
  <text x="122" y="516" class="num">3</text>
  <text x="172" y="516" class="label">Public data layer</text>
  <text x="172" y="549" class="line">data/public and public/generated feed</text>
  <text x="172" y="576" class="line">the read-only public interface.</text>

  <path class="arrow" d="M450 596 V636"/>

  <rect x="90" y="646" width="720" height="112" class="boxAlt"/>
  <text x="122" y="688" class="num">4</text>
  <text x="172" y="688" class="label">Static GitHub Pages site</text>
  <text x="172" y="721" class="line">Home, members, publications, media,</text>
  <text x="172" y="748" class="line">career map and support measures.</text>

  <rect x="90" y="796" width="720" height="82" rx="16" class="note"/>
  <text x="118" y="828" class="noteText">Pages never performs harvest, Prisma writes</text>
  <text x="118" y="856" class="noteText">or LLM requests; those stay local or server-side.</text>
</svg>
